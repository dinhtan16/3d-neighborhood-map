name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build, typecheck & test (Node)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: geo-core unit tests
        run: pnpm --filter @nmap/geo-core test
      - name: Generate assets (needed by the API seed)
        run: pnpm assets:build
      - name: API tests (PostGIS)
        run: pnpm --filter api test
      - name: API build
        run: pnpm --filter api build
      - name: Web typecheck
        run: pnpm --filter web typecheck
      - name: Web tests
        run: pnpm --filter web test
      - name: Web build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  importer:
    name: Importer tests (Python)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neighborhood_map
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/neighborhood_map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r services/map-importer/requirements.txt -r services/map-importer/requirements-dev.txt
      - name: Apply schema
        run: |
          for f in apps/api/src/database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: pytest (unit + DB integration)
        run: python -m pytest services/map-importer/tests -q
